<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Terraza Luna · Inventario</title>
<link rel="preconnect" href="https://biuaxkpyujypiigxolwt.supabase.co">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5efe6;--bg2:#fffdf9;--ink:#2c241b;--dim:#8a7a66;--faint:#bfb09e;
  --line:#e7ddcf;--line2:#d4c8b8;--gold:#8a6420;--golds:#75531a;--gold-pale:#f3ebdb;
  --danger:#a8442f;--ok:#4a7c3f;--warn:#9a6a20;
}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Inter Tight',sans-serif;color:var(--ink);background:var(--bg);min-height:100vh}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:12px 16px 10px;background:linear-gradient(180deg,rgba(245,239,230,.96),rgba(245,239,230,.78));backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px}
.moon-sm{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff8e9,#d9b76a 60%,#a07e34);flex-shrink:0}
.brand-txt{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600}
.back-btn{background:none;border:1px solid var(--line2);color:var(--dim);border-radius:8px;padding:6px 11px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:4px}
.back-btn:active{background:var(--gold-pale)}

/* ── MAIN ── */
.main{max-width:600px;margin:0 auto;padding:14px 14px 100px}

/* ── STATUS SUMMARY ── */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sum-card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;cursor:pointer;transition:all .15s}
.sum-card.active{border-color:var(--gold);background:var(--gold-pale)}
.sum-num{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:600;line-height:1}
.sum-lbl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.sum-card.s-ok .sum-num{color:var(--ok)}
.sum-card.s-low .sum-num{color:var(--warn)}
.sum-card.s-out .sum-num{color:var(--danger)}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.search-wrap{flex:1;min-width:140px;position:relative}
.search-wrap input{width:100%;padding:9px 12px 9px 32px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:14px;color:var(--ink);outline:none}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:14px;pointer-events:none}
.add-btn-main{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;white-space:nowrap;flex-shrink:0}
.add-btn-main:active{background:var(--golds)}

/* ── CATEGORY TABS ── */
.cat-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{white-space:nowrap;padding:7px 13px;border:1px solid var(--line);border-radius:999px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);background:#fff;cursor:pointer;flex-shrink:0;transition:all .15s}
.cat-tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ── ITEM LIST ── */
.inv-list{display:flex;flex-direction:column;gap:8px}
.inv-item{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.inv-item:active{background:var(--gold-pale)}
.inv-item.status-low{border-left:3px solid var(--warn)}
.inv-item.status-out{border-left:3px solid var(--danger)}
.inv-item.status-ok{border-left:3px solid var(--ok)}
.inv-body{flex:1;min-width:0}
.inv-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-cat{font-size:10px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;margin-top:1px}
.inv-stock-area{text-align:right;flex-shrink:0}
.inv-stock{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;line-height:1}
.inv-unit{font-size:10px;color:var(--dim);margin-top:1px}
.status-pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;border-radius:999px;margin-top:3px}
.pill-ok{background:#e6f4e3;color:var(--ok)}
.pill-low{background:#fff3e0;color:var(--warn)}
.pill-out{background:#fdecea;color:var(--danger)}

/* ── MODALS ── */
.mb{position:fixed;inset:0;background:rgba(40,30,15,.4);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.mb.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;background:var(--bg2);border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid var(--line2);padding:20px 18px 28px;animation:slideUp .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal h3{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:600;margin:0 0 4px}
.modal .msub{font-size:12px;color:var(--faint);margin-bottom:16px}
.flbl{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px;margin-top:12px}
.flbl:first-of-type{margin-top:0}
.finput{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;color:var(--ink);outline:none;font-family:'Inter Tight',sans-serif}
.finput:focus{border-color:var(--gold)}
select.finput{cursor:pointer}
.ma{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;padding:12px;border-radius:10px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-family:'Inter Tight',sans-serif;font-weight:600;cursor:pointer;transition:all .15s}
.btn-p{background:var(--gold);color:#fff;border:none}
.btn-p:active{background:var(--golds)}
.btn-g{border:1px solid var(--line2);color:var(--dim);background:#fff}
.btn-g:active{border-color:var(--faint);color:var(--ink)}
.btn-d{border:1px solid var(--danger);color:var(--danger);background:#fff}
.btn-d:active{background:var(--danger);color:#fff}

/* ── DETAIL MODAL ── */
.det-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.det-lbl{font-size:12px;color:var(--dim)}
.det-val{font-size:14px;font-weight:600}
.adj-row{display:flex;gap:8px;align-items:center;margin:14px 0 0}
.adj-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line2);background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;color:var(--dim)}
.adj-btn:active{border-color:var(--gold);color:var(--gold)}
.adj-input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:center;color:var(--ink);background:#fff;outline:none}
.adj-input:focus{border-color:var(--gold)}
.adj-unit{font-size:11px;color:var(--faint);margin-left:4px;white-space:nowrap}
.det-acts{display:flex;gap:7px;margin-top:14px}
.det-act{flex:1;padding:10px;border-radius:9px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Inter Tight',sans-serif;text-align:center}
.det-act.edit{border:1px solid var(--gold);color:var(--gold);background:#fff}
.det-act.edit:active{background:var(--gold);color:#fff}
.det-act.del{border:1px solid var(--danger);color:var(--danger);background:#fff}
.det-act.del:active{background:var(--danger);color:#fff}

/* ── MOVEMENT LOG ── */
.mov-list{margin-top:12px;max-height:180px;overflow-y:auto}
.mov-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.mov-qty{font-weight:700;min-width:50px;text-align:right;flex-shrink:0}
.mov-qty.pos{color:var(--ok)}
.mov-qty.neg{color:var(--danger)}
.mov-ref{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov-date{font-size:10px;color:var(--faint);flex-shrink:0}

/* ── EMPTY & TOAST ── */
.empty{text-align:center;padding:48px 20px;color:var(--faint)}
.empty-ico{font-size:40px;margin-bottom:10px}
.empty-txt{font-size:14px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:all .25s;z-index:200;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── BOOT ── */
#tlBoot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--bg)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.boot-txt{font-size:13px;color:var(--gold);letter-spacing:.3px}

/* ── CONFIRM ── */
#confirmModal .modal{padding-bottom:20px}
.cf-body{font-size:14px;color:var(--dim);margin:6px 0 14px;line-height:1.5}
</style>
</head>
<body>

<div id="tlBoot"><div class="spin"></div><div class="boot-txt">Cargando inventario…</div></div>
<div id="toast"></div>

<!-- APP -->
<div id="app" style="display:none">

<div class="topbar">
  <div class="brand">
    <div class="moon-sm"></div>
    <div>
      <div class="brand-txt">Inventario</div>
    </div>
  </div>
  <button class="back-btn" onclick="location.href='/access'">← Inicio</button>
</div>

<div class="main">

  <!-- Summary -->
  <div class="summary">
    <div class="sum-card s-ok" data-filter="ok" onclick="setStatusFilter('ok',this)">
      <div class="sum-num" id="sumOk">0</div>
      <div class="sum-lbl">En stock</div>
    </div>
    <div class="sum-card s-low" data-filter="low" onclick="setStatusFilter('low',this)">
      <div class="sum-num" id="sumLow">0</div>
      <div class="sum-lbl">Bajo stock</div>
    </div>
    <div class="sum-card s-out" data-filter="out" onclick="setStatusFilter('out',this)">
      <div class="sum-num" id="sumOut">0</div>
      <div class="sum-lbl">Agotado</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar ingrediente…" oninput="renderList()">
    </div>
    <button class="add-btn-main" onclick="openAddModal()">+ Agregar</button>
  </div>

  <!-- Category tabs -->
  <div class="cat-tabs" id="catTabs"></div>

  <!-- List -->
  <div class="inv-list" id="invList"></div>

</div>
</div>

<!-- ── MODAL: ADD / EDIT ── -->
<div class="mb" id="formModal">
  <div class="modal">
    <h3 id="formTitle">Agregar producto</h3>
    <div class="msub" id="formSub">Ingrediente o producto del inventario</div>
    <label class="flbl">Nombre</label>
    <input class="finput" id="fName" type="text" placeholder="Ej: Ron blanco">
    <label class="flbl">Categoría</label>
    <select class="finput" id="fCat">
      <option value="Licores">Licores</option>
      <option value="Frutas">Frutas y jugos</option>
      <option value="Mixers">Mixers y refrescos</option>
      <option value="Jarabes">Jarabes y condimentos</option>
      <option value="Cafetería">Cafetería</option>
      <option value="Cervezas">Cervezas</option>
      <option value="Comida">Comida</option>
      <option value="General">General</option>
    </select>
    <label class="flbl">Unidad de medida</label>
    <select class="finput" id="fUnit">
      <option value="ml">ml (mililitros)</option>
      <option value="piezas">piezas</option>
      <option value="gramos">gramos</option>
      <option value="litros">litros</option>
      <option value="porciones">porciones</option>
      <option value="rebanadas">rebanadas</option>
      <option value="manojos">manojos</option>
    </select>
    <label class="flbl">Existencia actual</label>
    <input class="finput" id="fStock" type="number" min="0" step="any" placeholder="0">
    <label class="flbl">Mínimo (alerta de stock bajo)</label>
    <input class="finput" id="fMin" type="number" min="0" step="any" placeholder="0">
    <label class="flbl">Notas (opcional)</label>
    <input class="finput" id="fNotes" type="text" placeholder="">
    <div class="ma">
      <button class="btn btn-g" onclick="closeFormModal()">Cancelar</button>
      <button class="btn btn-p" onclick="saveItem()">Guardar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: DETAIL / ADJUST ── -->
<div class="mb" id="detailModal">
  <div class="modal" style="padding-bottom:24px">
    <h3 id="detName">—</h3>
    <div class="msub" id="detCat">—</div>
    <div id="detRows"></div>

    <!-- Ajuste manual -->
    <div style="margin-top:14px;padding-top:12px;border-top:1px dashed var(--line2)">
      <label class="flbl" style="margin-top:0">Ajustar existencia</label>
      <div class="adj-row">
        <button class="adj-btn" onclick="adjStep(-1)">−</button>
        <input class="adj-input" id="adjVal" type="number" step="any" value="0">
        <span class="adj-unit" id="adjUnit"></span>
        <button class="adj-btn" onclick="adjStep(1)">+</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn-g" style="flex:1;padding:9px" onclick="applyAdj(-1)">− Restar</button>
        <button class="btn btn-p" style="flex:1;padding:9px" onclick="applyAdj(1)">+ Sumar</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn btn-g" style="flex:1;padding:9px;border-color:var(--ok);color:var(--ok)" onclick="setStockDirect()">✓ Establecer como valor exacto</button>
      </div>
    </div>

    <!-- Últimos movimientos -->
    <div style="margin-top:14px">
      <div style="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);margin-bottom:4px">Últimos movimientos</div>
      <div class="mov-list" id="movList"><div style="color:var(--faint);font-size:12px;padding:8px 0">Cargando…</div></div>
    </div>

    <div class="det-acts">
      <button class="det-act edit" onclick="openEditFromDetail()">✏️ Editar</button>
      <button class="det-act del" onclick="deleteItem()">🗑 Eliminar</button>
    </div>
    <div class="ma" style="margin-top:10px">
      <button class="btn btn-g" onclick="closeDetail()">Cerrar</button>
    </div>
  </div>
</div>

<!-- ── MODAL: CONFIRM ── -->
<div class="mb" id="confirmModal">
  <div class="modal">
    <h3 id="cfTitle">Confirmar</h3>
    <div class="cf-body" id="cfBody"></div>
    <div class="ma">
      <button class="btn btn-g" id="cfCancel">Cancelar</button>
      <button class="btn btn-d" id="cfOk">Confirmar</button>
    </div>
  </div>
</div>

<script>
var SU='https://biuaxkpyujypiigxolwt.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdWF4a3B5dWp5cGlpZ3hvbHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDY1ODUsImV4cCI6MjA5NTQ4MjU4NX0.4MJ2WfTo6tDNImcN0E5RCy4ilU2-sXnmRb6_BB85YaQ';
var SH={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};

function gid(i){return document.getElementById(i);}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return '$'+Math.round(n).toLocaleString('es-MX');}
function numFmt(n){return (n%1===0)?String(n):Number(n.toFixed(1)).toString();}

// ── AUTH ──
var TL_AUTH_KEY='tl_auth';
var loggedUser=null;
function tlGetAuth(){try{var s=JSON.parse(localStorage.getItem(TL_AUTH_KEY)||'null');if(!s||!s.id)return null;if(Date.now()-(s.ts||0)>12*60*60*1000){localStorage.removeItem(TL_AUTH_KEY);return null;}return s;}catch(e){return null;}}
function tlGoLogin(){location.href='/access';}

// ── HTTP ──
function sfetch(p,opts){return fetch(SU+p,Object.assign({headers:SH},opts||{})).then(function(r){return r.json();}).catch(function(e){console.error(e);return null;});}
function spost(p,body){return fetch(SU+p,{method:'POST',headers:Object.assign({},SH,{'Prefer':'return=minimal'}),body:JSON.stringify(body)}).catch(function(e){console.error(e);});}
function spatch(p,body){return fetch(SU+p,{method:'PATCH',headers:Object.assign({},SH,{'Prefer':'return=minimal'}),body:JSON.stringify(body)}).catch(function(e){console.error(e);});}
function sdelete(p){return fetch(SU+p,{method:'DELETE',headers:SH}).catch(function(e){console.error(e);});}

// ── STATE ──
var allItems=[];
var curCat='Todos';
var curStatusFilter='';
var editingId=null;
var detailId=null;

var CATS=['Todos','Licores','Frutas','Mixers','Jarabes','Cafetería','Cervezas','Comida','General'];

// ── TOAST ──
function showToast(m){var t=gid('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2000);}

// ── STATUS HELPERS ──
function itemStatus(it){
  if(it.stock<=0)return'out';
  if(it.stock<=it.min_stock)return'low';
  return'ok';
}
function statusLabel(s){return{ok:'En stock',low:'Bajo stock',out:'Agotado'}[s]||'';}
function statusPillClass(s){return{ok:'pill-ok',low:'pill-low',out:'pill-out'}[s]||'';}
function itemClass(s){return{ok:'status-ok',low:'status-low',out:'status-out'}[s]||'';}

// ── LOAD ──
async function loadItems(){
  var rows=await sfetch('/rest/v1/inventory_items?active=eq.true&order=category.asc,name.asc&select=*');
  if(Array.isArray(rows))allItems=rows;
  else allItems=[];
}

// ── RENDER ──
function setStatusFilter(f,el){
  if(curStatusFilter===f){curStatusFilter='';document.querySelectorAll('.sum-card').forEach(function(c){c.classList.remove('active');});}
  else{curStatusFilter=f;document.querySelectorAll('.sum-card').forEach(function(c){c.classList.remove('active');});if(el)el.classList.add('active');}
  renderList();
}

function renderCatTabs(){
  var t=gid('catTabs');t.innerHTML='';
  CATS.forEach(function(c){
    var b=document.createElement('button');
    b.className='cat-tab'+(c===curCat?' active':'');
    b.textContent=c;
    b.addEventListener('click',function(){curCat=c;document.querySelectorAll('.cat-tab').forEach(function(x){x.classList.remove('active');});b.classList.add('active');renderList();});
    t.appendChild(b);
  });
}

function renderSummary(){
  var ok=0,low=0,out=0;
  allItems.forEach(function(it){var s=itemStatus(it);if(s==='ok')ok++;else if(s==='low')low++;else out++;});
  gid('sumOk').textContent=ok;
  gid('sumLow').textContent=low;
  gid('sumOut').textContent=out;
}

function getFilteredItems(){
  var q=(gid('searchInput').value||'').toLowerCase().trim();
  return allItems.filter(function(it){
    if(curCat!=='Todos'&&it.category!==curCat)return false;
    if(curStatusFilter&&itemStatus(it)!==curStatusFilter)return false;
    if(q&&it.name.toLowerCase().indexOf(q)<0&&it.category.toLowerCase().indexOf(q)<0)return false;
    return true;
  });
}

function renderList(){
  renderSummary();
  var items=getFilteredItems();
  var list=gid('invList');
  if(!items.length){list.innerHTML='<div class="empty"><div class="empty-ico">📦</div><div class="empty-txt">Sin productos en esta categoría</div></div>';return;}
  list.innerHTML='';
  items.forEach(function(it){
    var s=itemStatus(it);
    var el=document.createElement('div');
    el.className='inv-item '+itemClass(s);
    el.innerHTML='<div class="inv-body"><div class="inv-name">'+esc(it.name)+'</div><div class="inv-cat">'+esc(it.category)+'</div></div><div class="inv-stock-area"><div class="inv-stock" style="color:'+(s==='ok'?'var(--ok)':s==='low'?'var(--warn)':'var(--danger)')+'">'+numFmt(it.stock)+'</div><div class="inv-unit">'+esc(it.unit)+'</div><div><span class="status-pill '+statusPillClass(s)+'">'+statusLabel(s)+'</span></div></div>';
    el.addEventListener('click',function(){openDetail(it.id);});
    list.appendChild(el);
  });
}

// ── FORM MODAL ──
function openAddModal(){
  editingId=null;
  gid('formTitle').textContent='Agregar al inventario';
  gid('formSub').textContent='Nuevo ingrediente o producto';
  gid('fName').value='';gid('fCat').value='General';gid('fUnit').value='ml';
  gid('fStock').value='0';gid('fMin').value='0';gid('fNotes').value='';
  gid('formModal').classList.add('show');
  setTimeout(function(){gid('fName').focus();},250);
}
function openEditModal(id){
  var it=allItems.find(function(x){return x.id===id;});
  if(!it)return;
  editingId=id;
  gid('formTitle').textContent='Editar producto';
  gid('formSub').textContent=it.name;
  gid('fName').value=it.name;gid('fCat').value=it.category;gid('fUnit').value=it.unit;
  gid('fStock').value=it.stock;gid('fMin').value=it.min_stock;gid('fNotes').value=it.notes||'';
  gid('formModal').classList.add('show');
  setTimeout(function(){gid('fName').focus();},250);
}
function closeFormModal(){gid('formModal').classList.remove('show');editingId=null;}
gid('formModal').addEventListener('click',function(e){if(e.target===gid('formModal'))closeFormModal();});

async function saveItem(){
  var name=gid('fName').value.trim();
  if(!name){showToast('Escribe un nombre');return;}
  var data={name:name,category:gid('fCat').value,unit:gid('fUnit').value,stock:parseFloat(gid('fStock').value)||0,min_stock:parseFloat(gid('fMin').value)||0,notes:gid('fNotes').value.trim(),active:true,updated_at:new Date().toISOString()};
  if(editingId){
    await spatch('/rest/v1/inventory_items?id=eq.'+editingId,data);
    var idx=allItems.findIndex(function(x){return x.id===editingId;});
    if(idx>=0)allItems[idx]=Object.assign(allItems[idx],data);
    showToast('✓ Producto actualizado');
  }else{
    data.id='inv-'+uid();
    await spost('/rest/v1/inventory_items',data);
    allItems.push(data);
    // Log movement for initial stock
    if(data.stock>0){await logMovement(data.id,data.stock,'Existencia inicial',loggedUser?loggedUser.username:'sistema');}
  }
  closeFormModal();
  renderList();
}

// ── DETAIL MODAL ──
function openDetail(id){
  var it=allItems.find(function(x){return x.id===id;});
  if(!it)return;
  detailId=id;
  var s=itemStatus(it);
  gid('detName').textContent=it.name;
  gid('detCat').textContent=it.category+' · '+it.unit;
  gid('adjVal').value=0;
  gid('adjUnit').textContent=it.unit;
  gid('detRows').innerHTML='<div class="det-row"><span class="det-lbl">Existencia actual</span><span class="det-val" style="color:'+(s==='ok'?'var(--ok)':s==='low'?'var(--warn)':'var(--danger)')+'">'+numFmt(it.stock)+' '+esc(it.unit)+'</span></div><div class="det-row"><span class="det-lbl">Mínimo de stock</span><span class="det-val">'+numFmt(it.min_stock)+' '+esc(it.unit)+'</span></div><div class="det-row"><span class="det-lbl">Estado</span><span class="det-val"><span class="status-pill '+statusPillClass(s)+'">'+statusLabel(s)+'</span></span></div>'+(it.notes?'<div class="det-row"><span class="det-lbl">Notas</span><span class="det-val" style="font-weight:400;font-size:13px">'+esc(it.notes)+'</span></div>':'');
  gid('movList').innerHTML='<div style="color:var(--faint);font-size:12px;padding:8px 0">Cargando…</div>';
  gid('detailModal').classList.add('show');
  loadMovements(id);
}
function closeDetail(){gid('detailModal').classList.remove('show');detailId=null;}
gid('detailModal').addEventListener('click',function(e){if(e.target===gid('detailModal'))closeDetail();});

async function loadMovements(id){
  var rows=await sfetch('/rest/v1/inventory_movements?item_id=eq.'+id+'&order=created_at.desc&limit=15&select=*');
  if(!Array.isArray(rows)||!rows.length){gid('movList').innerHTML='<div style="color:var(--faint);font-size:12px;padding:8px 0">Sin movimientos registrados</div>';return;}
  gid('movList').innerHTML=rows.map(function(m){
    var d=new Date(m.created_at);
    var ds=d.getDate()+'/'+(d.getMonth()+1)+' '+d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
    var cls=m.quantity>=0?'pos':'neg';
    var sign=m.quantity>=0?'+':'';
    var unit='';var it=allItems.find(function(x){return x.id===id;});if(it)unit=' '+it.unit;
    return'<div class="mov-row"><span class="mov-qty '+cls+'">'+sign+numFmt(m.quantity)+unit+'</span><span class="mov-ref">'+esc(m.reference||m.reason)+'</span><span class="mov-date">'+ds+'</span></div>';
  }).join('');
}

function adjStep(d){
  var v=parseFloat(gid('adjVal').value)||0;
  var it=allItems.find(function(x){return x.id===detailId;});
  var step=it&&(it.unit==='ml')?10:(it&&it.unit==='gramos')?10:1;
  gid('adjVal').value=Math.max(0,v+d*step);
}

async function applyAdj(sign){
  var it=allItems.find(function(x){return x.id===detailId;});if(!it)return;
  var delta=parseFloat(gid('adjVal').value)||0;
  if(delta<=0){showToast('Ingresa una cantidad');return;}
  var newStock=Math.max(0,it.stock+sign*delta);
  var reason=sign>0?'Entrada manual':'Salida manual';
  await spatch('/rest/v1/inventory_items?id=eq.'+detailId,{stock:newStock,updated_at:new Date().toISOString()});
  await logMovement(detailId,sign*delta,reason,loggedUser?loggedUser.username:'sistema');
  it.stock=newStock;
  gid('adjVal').value=0;
  renderList();
  closeDetail();
  openDetail(detailId);
  showToast('✓ Inventario actualizado');
}

async function setStockDirect(){
  var it=allItems.find(function(x){return x.id===detailId;});if(!it)return;
  var val=parseFloat(gid('adjVal').value);
  if(isNaN(val)||val<0){showToast('Valor inválido');return;}
  var delta=val-it.stock;
  await spatch('/rest/v1/inventory_items?id=eq.'+detailId,{stock:val,updated_at:new Date().toISOString()});
  await logMovement(detailId,delta,'Ajuste de inventario',loggedUser?loggedUser.username:'sistema');
  it.stock=val;
  gid('adjVal').value=0;
  renderList();
  closeDetail();
  openDetail(detailId);
  showToast('✓ Existencia establecida');
}

function openEditFromDetail(){
  closeDetail();
  openEditModal(detailId||'');
}

// ── DELETE ──
function deleteItem(){
  var it=allItems.find(function(x){return x.id===detailId;});if(!it)return;
  openConfirm('Eliminar producto','"'+it.name+'" será desactivado del inventario.','Eliminar',async function(){
    await spatch('/rest/v1/inventory_items?id=eq.'+detailId,{active:false});
    allItems=allItems.filter(function(x){return x.id!==detailId;});
    closeDetail();renderList();showToast('Producto eliminado');
  });
}

// ── CONFIRM MODAL ──
function openConfirm(title,body,ok,onOk){
  gid('cfTitle').textContent=title;gid('cfBody').textContent=body;gid('cfOk').textContent=ok;
  var m=gid('confirmModal');
  var bok=gid('cfOk'),bcan=gid('cfCancel');
  var nok=bok.cloneNode(true),ncan=bcan.cloneNode(true);
  bok.parentNode.replaceChild(nok,bok);bcan.parentNode.replaceChild(ncan,bcan);
  m.classList.add('show');
  gid('cfOk').addEventListener('click',function(){m.classList.remove('show');onOk();});
  gid('cfCancel').addEventListener('click',function(){m.classList.remove('show');});
}
gid('confirmModal').addEventListener('click',function(e){if(e.target===gid('confirmModal'))gid('confirmModal').classList.remove('show');});

// ── LOG MOVEMENT ──
async function logMovement(itemId,qty,reason,by){
  await spost('/rest/v1/inventory_movements',{id:'mov-'+uid(),item_id:itemId,quantity:qty,reason:reason,reference:reason,created_by:by||'sistema',created_at:new Date().toISOString()});
}

// ── INIT ──
(async function init(){
  var auth=tlGetAuth();
  if(!auth){tlGoLogin();return;}
  // Validar contra BD
  var users=await sfetch('/rest/v1/app_users?id=eq.'+encodeURIComponent(auth.id)+'&select=*');
  var found=Array.isArray(users)?users.find(function(u){return u.active;}):null;
  if(!found){localStorage.removeItem(TL_AUTH_KEY);tlGoLogin();return;}
  if(found.role!=='admin'){showToast('Solo administradores pueden acceder');setTimeout(function(){tlGoLogin();},1500);return;}
  loggedUser=found;
  await loadItems();
  renderCatTabs();
  renderList();
  gid('tlBoot').style.display='none';
  gid('app').style.display='block';
})();
</script>
