<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Etiquetado IA — Terraza Luna</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Inter',sans-serif;background:#0d0b08;color:#f0ebe0;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .card{background:#1a1814;border:1px solid #2e2a22;border-radius:20px;padding:32px;max-width:520px;width:100%;}
  h1{font-size:20px;font-weight:700;margin-bottom:4px;color:#d4a853;}
  .sub{font-size:13px;color:#6b6355;margin-bottom:28px;}
  .tabla{display:flex;flex-direction:column;gap:16px;}
  .item{background:#111009;border:1px solid #2e2a22;border-radius:14px;padding:18px;}
  .item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .item-label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#8a7d68;}
  .item-count{font-size:13px;color:#d4a853;font-weight:600;}
  .bar-wrap{height:6px;background:#2e2a22;border-radius:3px;overflow:hidden;margin-bottom:8px;}
  .bar{height:100%;background:linear-gradient(90deg,#7c3aed,#d4a853);border-radius:3px;width:0%;transition:width .4s ease;}
  .status{font-size:11px;color:#6b6355;min-height:16px;}
  .sample{font-size:10px;color:#4a4235;margin-top:4px;min-height:14px;word-break:break-all;}
  .btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:14px;font-weight:700;cursor:pointer;margin-top:20px;letter-spacing:.04em;}
  .btn-start{background:linear-gradient(135deg,#7c3aed,#d4a853);color:#000;}
  .btn-start:disabled{opacity:.5;cursor:not-allowed;}
  .done{text-align:center;padding:12px;border-radius:10px;background:rgba(212,168,83,.08);border:1px solid rgba(212,168,83,.2);color:#d4a853;font-size:13px;font-weight:600;margin-top:16px;display:none;}
</style>
</head>
<body>
<div class="card">
  <h1>✦ Etiquetado Semántico con IA</h1>
  <div class="sub">Clasifica todas las cartas de Terraza Luna para activar el algoritmo de recomendación inteligente.</div>
  <div class="tabla">
    <div class="item">
      <div class="item-header">
        <div class="item-label">❓ Preguntas</div>
        <div class="item-count" id="cnt-q">—</div>
      </div>
      <div class="bar-wrap"><div class="bar" id="bar-q"></div></div>
      <div class="status" id="status-q">En espera…</div>
      <div class="sample" id="sample-q"></div>
    </div>
    <div class="item">
      <div class="item-header">
        <div class="item-label">⚡ Retos</div>
        <div class="item-count" id="cnt-d">—</div>
      </div>
      <div class="bar-wrap"><div class="bar" id="bar-d"></div></div>
      <div class="status" id="status-d">En espera…</div>
      <div class="sample" id="sample-d"></div>
    </div>
  </div>
  <button class="btn btn-start" id="btn" onclick="iniciar()">▶ Iniciar etiquetado</button>
  <div class="done" id="done">✓ ¡Completado! El algoritmo de recomendación ya está activo.</div>
</div>

<script>
const SB='https://biuaxkpyujypiigxolwt.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdWF4a3B5dWp5cGlpZ3hvbHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDY1ODUsImV4cCI6MjA5NTQ4MjU4NX0.4MJ2WfTo6tDNImcN0E5RCy4ilU2-sXnmRb6_BB85YaQ';

async function getTotal(tabla){
  var r=await fetch(SB+'/rest/v1/'+tabla+'?tags=eq.%7B%7D&select=id',{
    headers:{apikey:SK,Authorization:'Bearer '+SK,Prefer:'count=exact',Range:'0-0'}
  });
  return parseInt((r.headers.get('content-range')||'').split('/')[1]||'0',10);
}

async function etiquetar(tabla, prefix){
  var bar=document.getElementById('bar-'+prefix);
  var status=document.getElementById('status-'+prefix);
  var sample=document.getElementById('sample-'+prefix);
  var cnt=document.getElementById('cnt-'+prefix);

  var total=await getTotal(tabla);
  cnt.textContent=total+' sin etiquetar';
  if(total===0){bar.style.width='100%';status.textContent='✓ Ya etiquetadas';return;}

  var procesados=0;
  while(true){
    try{
      var res=await fetch(SB+'/functions/v1/tag-cards',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+SK},
        body:JSON.stringify({table:tabla,limit:50})
      });
      var data=await res.json();
      if(data.error){status.textContent='Error: '+data.error;break;}
      procesados+=data.tagged||0;
      var remaining=data.remaining||0;
      var pctVal=total>0?Math.min(100,Math.round((procesados/total)*100)):100;
      bar.style.width=pctVal+'%';
      cnt.textContent=procesados+' / '+total;
      status.textContent='Etiquetadas: '+procesados+' · Restantes: '+remaining;
      if(data.sample&&data.sample.length){
        sample.textContent=data.sample.slice(0,3).map(function(s){return '['+s.tags.join(', ')+']';}).join(' · ');
      }
      if(data.done||remaining===0){
        status.textContent='✓ Listo — '+procesados+' cartas etiquetadas';
        bar.style.width='100%';
        break;
      }
    }catch(e){status.textContent='Error: '+e.message;break;}
    await new Promise(function(r){setTimeout(r,300);});
  }
}

async function iniciar(){
  var btn=document.getElementById('btn');
  btn.disabled=true;btn.textContent='Procesando…';
  document.getElementById('status-q').textContent='Iniciando…';
  document.getElementById('status-d').textContent='En espera…';
  await etiquetar('tor_questions','q');
  document.getElementById('status-d').textContent='Iniciando…';
  await etiquetar('tor_dares','d');
  btn.textContent='✓ Completado';
  document.getElementById('done').style.display='block';
}
</script>
</body>
</html>
