<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terraza Luna · Club de Lealtad</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8;--bg2:#ffffff;
  --ink:#1a1610;--dim:#4a4337;--faint:#7a7264;
  --line:#d8cfbd;--line2:#c4b89f;
  --gold:#8a6420;--golds:#6b4d18;--gold-pale:#fff8e8;
  --ok:#3a7a3a;--danger:#a8442f;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Inter Tight',sans-serif;color:var(--ink);min-height:100vh;
  background:
    radial-gradient(900px 600px at 85% -5%,rgba(138,100,32,.1),transparent 55%),
    radial-gradient(700px 500px at -10% 110%,rgba(138,100,32,.07),transparent 55%),
    radial-gradient(400px 400px at 50% 50%,rgba(138,100,32,.03),transparent 70%),
    var(--bg);
  overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px 60px;
}

/* DECORATIVE CIRCLES */
.deco{position:fixed;pointer-events:none;z-index:0}
.deco-1{top:-120px;right:-80px;width:400px;height:400px;border-radius:50%;border:1px solid rgba(138,100,32,.08)}
.deco-2{top:-60px;right:-40px;width:280px;height:280px;border-radius:50%;border:1px solid rgba(138,100,32,.06)}
.deco-3{bottom:-100px;left:-80px;width:360px;height:360px;border-radius:50%;border:1px solid rgba(138,100,32,.06)}

/* HEADER */
header{text-align:center;margin-bottom:44px;position:relative;z-index:1}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:14px}
.ornament-line{flex:1;max-width:60px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament-star{font-size:16px;color:var(--gold);opacity:.6}
.logo{font-family:'Cormorant Garamond',serif;font-size:clamp(42px,7vw,64px);font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--ink);line-height:1}
.logo-sub{font-size:10px;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--faint);margin-top:10px}
.hero-text{font-family:'Cormorant Garamond',serif;font-size:clamp(18px,3vw,24px);color:var(--dim);margin-top:16px;font-style:italic;font-weight:400;line-height:1.4}

/* CARD */
.glass-card{
  background:var(--bg2);border:1px solid var(--line);border-radius:20px;
  padding:40px 36px;width:100%;max-width:460px;
  box-shadow:0 4px 12px rgba(60,45,20,.04),0 16px 48px rgba(138,100,32,.08);
  position:relative;z-index:1;
}

/* CARD TITLE */
.card-title{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--ink);margin-bottom:6px}
.card-sub{font-size:13px;color:var(--dim);margin-bottom:28px;line-height:1.5}

/* FIELD */
.field{margin-bottom:20px}
.field label{display:block;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.field input{
  width:100%;padding:14px 16px;
  background:var(--bg);border:1.5px solid var(--line2);border-radius:12px;
  font-family:'Inter Tight',sans-serif;font-size:16px;color:var(--ink);
  outline:none;transition:border-color .2s,box-shadow .2s,background .2s;-webkit-appearance:none;
  letter-spacing:.02em;
}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(138,100,32,.1);background:var(--bg2)}
.field input::placeholder{color:var(--faint)}

/* BUTTONS */
.btn-primary{
  width:100%;padding:15px;background:var(--gold);color:#fff;border:none;border-radius:12px;
  font-family:'Inter Tight',sans-serif;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:transform .2s,box-shadow .2s,background .2s;
  box-shadow:0 6px 20px rgba(138,100,32,.32);margin-top:4px;
}
.btn-primary:hover{background:var(--golds);transform:translateY(-2px);box-shadow:0 12px 32px rgba(138,100,32,.38)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}

.btn-register{
  width:100%;padding:14px;background:transparent;color:var(--gold);
  border:1.5px solid rgba(138,100,32,.4);border-radius:12px;
  font-family:'Inter Tight',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;
  cursor:pointer;transition:background .2s,border-color .2s,transform .2s;
  margin-top:12px;
}
.btn-register:hover{background:var(--gold-pale);border-color:var(--gold);transform:translateY(-1px)}
.btn-register:active{transform:translateY(0)}

/* DIVIDER */
.divider{position:relative;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 30%,var(--line2) 70%,transparent);margin:24px 0}
.divider-dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:5px;height:5px;background:var(--gold);border-radius:50%}

/* MESSAGE */
.msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;line-height:1.4}
.msg.ok{background:rgba(58,122,58,.08);color:var(--ok);border:1px solid rgba(58,122,58,.2)}
.msg.err{background:rgba(168,68,47,.07);color:var(--danger);border:1px solid rgba(168,68,47,.18)}

/* FEATURES */
.features{display:flex;gap:20px;justify-content:center;margin-top:32px;flex-wrap:wrap;position:relative;z-index:1}
.feature{text-align:center;flex:1;min-width:100px;max-width:130px}
.feature-icon{font-size:28px;margin-bottom:8px}
.feature-text{font-size:11px;color:var(--faint);letter-spacing:.05em;line-height:1.4}

/* FOOTER */
footer{margin-top:32px;text-align:center;position:relative;z-index:1}
.staff-link{
  font-size:11px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase;
  text-decoration:none;transition:color .2s;cursor:pointer;background:none;border:none;
  font-family:'Inter Tight',sans-serif;padding:6px 12px;
}
.staff-link:hover{color:var(--gold)}
.footer-copy{font-size:10px;color:var(--line2);margin-top:8px;letter-spacing:.12em;text-transform:uppercase}

/* REVEAL */
[data-reveal]{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
[data-reveal].vis{opacity:1;transform:none}
</style>
</head>
<body>

<div class="deco deco-1"></div>
<div class="deco deco-2"></div>
<div class="deco deco-3"></div>

<header data-reveal>
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-star">✦</div>
    <div class="ornament-line"></div>
  </div>
  <div class="logo">Terraza Luna</div>
  <div class="logo-sub">Club de Lealtad</div>
  <div class="hero-text">Cada visita te acerca a tu próxima recompensa</div>
</header>

<div class="glass-card" data-reveal>
  <div class="card-title" style="text-align:center;margin-bottom:6px">Ingresa a mi tarjeta</div>
  <p style="text-align:center;font-size:12px;color:var(--faint);margin-bottom:24px;letter-spacing:.04em">Ingresa tu número para ver tu tarjeta</p>

  <div id="msg"></div>

  <div class="field" style="margin-top:4px">
    <label>Número de WhatsApp</label>
    <input type="tel" id="phoneInput" placeholder="55 0000 0000"
      autocomplete="tel" inputmode="tel"
      onkeydown="if(event.key==='Enter')ingresar()">
  </div>

  <button class="btn-primary" id="ingreButton" onclick="ingresar()" style="margin-top:20px">Ingresar →</button>

  <div class="divider"><div class="divider-dot"></div></div>

  <button class="btn-register" onclick="location.href='registro.html'">
    ¿Aún no tienes tu tarjeta? → Regístrate
  </button>
</div>

<div class="features" data-reveal>
  <div class="feature">
    <div class="feature-icon">🍹</div>
    <div class="feature-text">Acumula sellos en cada visita</div>
  </div>
  <div class="feature">
    <div class="feature-icon">🎁</div>
    <div class="feature-text">Canjea recompensas exclusivas</div>
  </div>
  <div class="feature">
    <div class="feature-icon">🎂</div>
    <div class="feature-text">Beneficio especial en tu cumpleaños</div>
  </div>
</div>

<footer data-reveal>
  <button class="staff-link" onclick="location.href='staff.html'">¿Eres staff? → Entrar al panel</button>
  <div class="footer-copy">Terraza Luna · Club de Lealtad · 2026</div>
</footer>

<script>
const SUPA='https://biuaxkpyujypiigxolwt.supabase.co';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdWF4a3B5dWp5cGlpZ3hvbHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDY1ODUsImV4cCI6MjA5NTQ4MjU4NX0.4MJ2WfTo6tDNImcN0E5RCy4ilU2-sXnmRb6_BB85YaQ';

const io=new IntersectionObserver(e=>e.forEach(el=>{if(el.isIntersecting){el.target.classList.add('vis');io.unobserve(el.target)}}),{threshold:.05});
document.querySelectorAll('[data-reveal]').forEach(el=>io.observe(el));
setTimeout(()=>document.querySelectorAll('[data-reveal]').forEach(el=>{if(el.getBoundingClientRect().top<window.innerHeight)el.classList.add('vis')}),100);

function cleanWa(raw){
  let n=raw.replace(/[\s\-()]/g,"");
  if(n.startsWith("+52"))n=n.slice(3);
  else if(n.startsWith("52")&&n.length>10)n=n.slice(2);
  return n;
}

async function ingresar(){
  const phone=cleanWa(document.getElementById('phoneInput').value.trim());
  if(!phone){showMsg('Ingresa tu número de WhatsApp.','err');return}
  const btn=document.getElementById('ingreButton');
  btn.disabled=true;btn.textContent='Buscando…';
  document.getElementById('msg').innerHTML='';
  try{
    const r=await fetch(`${SUPA}/rest/v1/loyalty_clients?whatsapp=eq.${encodeURIComponent(phone)}&select=id`,

      showMsg('No encontramos tu tarjeta con ese número. ¿Ya te registraste?','err');
    } else {
      location.href='cliente.html?id='+data[0].id;
    }
