<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
  <link rel="preconnect" href="https://biuaxkpyujypiigxolwt.supabase.co">
  <link rel="dns-prefetch" href="https://biuaxkpyujypiigxolwt.supabase.co">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Terraza Luna · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5efe6;--card:#fffdf9;--ink:#2c241b;--dim:#8a7a66;--line:#e7ddcf;
  --gold:#8a6420;--golds:#75531a;--gold-pale:#f3ebdb;--ok:#5a7d4f;--danger:#a8442f;
}
html,body{height:100%}
body{
  font-family:'Inter Tight',sans-serif;color:var(--ink);
  background:radial-gradient(900px 500px at 88% -8%,rgba(138,100,32,.12),transparent 60%),
             radial-gradient(700px 420px at -8% 108%,rgba(138,100,32,.08),transparent 60%),var(--bg);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.wrap{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:26px}
.moon{width:46px;height:46px;border-radius:50%;margin:0 auto 12px;
  background:radial-gradient(circle at 34% 30%,#fff8e9,#d9b76a 60%,#a07e34);
  box-shadow:0 6px 22px rgba(138,100,32,.35)}
.brand h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;letter-spacing:.5px}
.brand p{color:var(--dim);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-top:4px}

/* LOGIN */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 24px;
  box-shadow:0 18px 50px rgba(74,57,33,.10)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:16px;color:var(--ink);outline:none;transition:border-color .15s}
.field input:focus{border-color:var(--gold)}
.pw{position:relative}
.pw .eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:17px;cursor:pointer;padding:6px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--gold);color:#fff;font-family:'Inter Tight',sans-serif;font-size:15px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:background .2s,transform .1s;box-shadow:0 6px 18px rgba(138,100,32,.3)}
.btn:hover{background:var(--golds)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:2px 0 10px;text-align:center}

/* HUB */
.hub{display:none}
.hubhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hubhead .who{font-size:13px;color:var(--dim)}
.hubhead .who b{color:var(--ink);font-weight:600}
.logout{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer}
.logout:hover{border-color:var(--gold);background:var(--gold-pale)}
.cards{display:grid;gap:13px}
.app{display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px;
  box-shadow:0 8px 24px rgba(74,57,33,.07);transition:transform .12s,box-shadow .2s,border-color .2s}
.app:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(74,57,33,.13);border-color:var(--gold)}
.app .ico{width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--gold-pale);flex-shrink:0}
.app .tx h3{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;line-height:1.1}
.app .tx p{font-size:12.5px;color:var(--dim);margin-top:3px}
.app .arr{margin-left:auto;color:var(--gold);font-size:20px}
.foot{text-align:center;color:var(--dim);font-size:11px;margin-top:20px;letter-spacing:.5px}
</style>
</head>
<body>
<div id="tlBoot" style="position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(900px 500px at 88% -8%,rgba(138,100,32,.12),transparent 60%),var(--bg)">
  <div style="width:42px;height:42px;border-radius:50%;border:3px solid #e7ddcf;border-top-color:#8a6420;animation:tlspin .8s linear infinite"></div>
  <div style="font-family:'Inter Tight',sans-serif;color:#8a6420;font-size:14px;letter-spacing:.5px">Iniciando sesión…</div>
</div>
<style>@keyframes tlspin{to{transform:rotate(360deg)}}</style>
<div class="wrap">
  <div class="brand">
    <div class="moon"></div>
    <h1>Terraza Luna</h1>
    <p>Acceso al sistema</p>
  </div>

  <!-- LOGIN -->
  <div class="card" id="loginCard">
    <div class="field">
      <label>Usuario</label>
      <input id="u" type="text" placeholder="tu usuario" autocomplete="username" autocapitalize="none">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <div class="pw">
        <input id="p" type="password" placeholder="••••••••" autocomplete="current-password">
        <button class="eye" id="eye" type="button">👁</button>
      </div>
    </div>
    <div class="err" id="err"></div>
    <button class="btn" id="enter">Entrar</button>
  </div>

  <!-- HUB -->
  <div class="hub" id="hub">
    <div class="hubhead">
      <div class="who">Hola, <b id="whoName">—</b> <span id="whoRole" style="opacity:.7"></span></div>
      <button class="logout" id="logout">Salir</button>
    </div>
    <div class="cards" id="cards"></div>
    <div class="foot">Terraza Luna · Panel unificado</div>
  </div>
</div>

<script>
var SU='https://biuaxkpyujypiigxolwt.supabase.co';
var SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdWF4a3B5dWp5cGlpZ3hvbHd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MDY1ODUsImV4cCI6MjA5NTQ4MjU4NX0.4MJ2WfTo6tDNImcN0E5RCy4ilU2-sXnmRb6_BB85YaQ';
var SH={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
function gid(i){return document.getElementById(i);}
function sfetch(p){return fetch(SU+p,{headers:SH}).then(function(r){return r.json();}).catch(function(){return null;});}

// ══ SESIÓN COMPARTIDA ══
var TL_AUTH_KEY='tl_auth';
function tlGetAuth(){try{var s=JSON.parse(localStorage.getItem(TL_AUTH_KEY)||'null');if(!s||!s.id)return null;if(Date.now()-(s.ts||0)>12*60*60*1000){localStorage.removeItem(TL_AUTH_KEY);return null;}return s;}catch(e){return null;}}
function tlSetAuth(u){try{localStorage.setItem(TL_AUTH_KEY,JSON.stringify({id:u.id,username:u.username,role:u.role,can_inventory:!!u.can_inventory,ts:Date.now()}));}catch(e){}}
function tlClearAuth(){try{localStorage.removeItem(TL_AUTH_KEY);}catch(e){}}

// Catálogo de apps. admin=todas; otros roles solo Órdenes.
var APPS=[
  {key:'ordenes',  title:'Órdenes',  desc:'Mesas, comandas y cobro',     ico:'🧾', href:'/ordenes',   roles:'*'},
  {key:'finanzas', title:'Finanzas', desc:'Ingresos, egresos y reportes', ico:'📊', href:'/finanzas',  roles:['admin']},
  {key:'inventario', title:'Inventario', desc:'Stock de productos e insumos',  ico:'📦', href:'/inventario', roles:['admin'], inv_access:true},
  {key:'lealtad',    title:'Lealtad',    desc:'Clientes, visitas y premios',   ico:'💳', href:'/staff',      roles:['admin']}
];

function canSee(app,user){
  if(app.roles==='*')return true;
  if(app.roles.indexOf(user.role)>=0)return true;
  if(app.inv_access&&user.can_inventory)return true;
  return false;
}

// Decide a dónde entra el usuario:
//  - 1 sola app permitida  -> redirección automática (sin tarjetas)
//  - varias apps           -> mostrar el hub con tarjetas
function enterFor(user){
  var allowed=APPS.filter(function(a){return canSee(a,user);});
  if(allowed.length===1){ location.href=allowed[0].href; return; }
  if(allowed.length===0){ gid('err').textContent='Tu usuario no tiene apps asignadas'; return; }
  renderHub(user,allowed);
}

function renderHub(user,allowed){
  var boot=gid('tlBoot'); if(boot)boot.style.display='none';
  gid('loginCard').style.display='none';
  gid('hub').style.display='block';
  gid('whoName').textContent=user.username;
  gid('whoRole').textContent='· '+(user.role||'');
  var c=gid('cards');c.innerHTML='';
  (allowed||APPS.filter(function(a){return canSee(a,user);})).forEach(function(a){
    var el=document.createElement('a');
    el.className='app';el.href=a.href;
    el.innerHTML='<div class="ico">'+a.ico+'</div><div class="tx"><h3>'+a.title+'</h3><p>'+a.desc+'</p></div><div class="arr">→</div>';
    c.appendChild(el);
  });
}

async function doLogin(){
  var u=gid('u').value.trim(),p=gid('p').value;
  gid('err').textContent='';
  if(!u||!p){gid('err').textContent='Completa usuario y contraseña';return;}
  gid('enter').disabled=true;gid('enter').textContent='Verificando…';
  try{
    var rows=await sfetch('/rest/v1/app_users?username=eq.'+encodeURIComponent(u)+'&select=*');
    if(!Array.isArray(rows)){gid('err').textContent='Error de conexión';return;}
    var found=null;for(var i=0;i<rows.length;i++){if(rows[i].username===u&&rows[i].user_password===p){found=rows[i];break;}}
    if(!found){gid('err').textContent='Usuario o contraseña incorrectos';return;}
    if(!found.active){gid('err').textContent='Usuario bloqueado';return;}
    tlSetAuth(found);
    enterFor(found);
  }catch(e){gid('err').textContent='Error: '+e.message;}
  finally{gid('enter').disabled=false;gid('enter').textContent='Entrar';}
}

gid('enter').addEventListener('click',doLogin);
gid('p').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
gid('u').addEventListener('keydown',function(e){if(e.key==='Enter')gid('p').focus();});
gid('eye').addEventListener('click',function(){var f=gid('p');if(f.type==='password'){f.type='text';this.textContent='🙈';}else{f.type='password';this.textContent='👁';}});
gid('logout').addEventListener('click',function(){tlClearAuth();location.reload();});

// Restaurar sesión: si ya hay sesión válida, mostrar el hub directo.
(async function(){
  var s=tlGetAuth();
  if(!s)return;
  // Hay sesión: mostrar overlay "Iniciando sesión…" y ocultar el login para que
  // NO se vea un segundo login al reabrir.
  gid('loginCard').style.display='none';
  gid('tlBoot').style.display='flex';
  var rows=await sfetch('/rest/v1/app_users?id=eq.'+encodeURIComponent(s.id)+'&select=*');
  var found=Array.isArray(rows)?rows.find(function(r){return r.active;}):null;
  if(found){ tlSetAuth(found); enterFor(found); } // si redirige, el overlay queda hasta cargar la otra página
  else { tlClearAuth(); gid('tlBoot').style.display='none'; gid('loginCard').style.display=''; }
})();
</script>
</body>
</html>
